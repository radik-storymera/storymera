name: ${COMPOSE_PROJECT_NAME:-storymera}

x-api-environment: &api-environment
  NODE_ENV: production
  API_HOST: ${API_HOST:-0.0.0.0}
  API_PORT: ${API_PORT:-3001}
  APP_ORIGIN: ${APP_ORIGIN:?APP_ORIGIN is required}
  PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:?PUBLIC_SITE_URL is required}
  CONTACT_EMAIL: ${CONTACT_EMAIL:-}
  DB_HOST: db
  DB_PORT: 3306
  DB_NAME: ${DB_NAME:?DB_NAME is required}
  DB_USER: ${DB_USER:?DB_USER is required}
  DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
  MEDIA_IMAGE_MB: ${MEDIA_IMAGE_MB:-12}
  MEDIA_VIDEO_MB: ${MEDIA_VIDEO_MB:-200}

services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:?DB_NAME is required}
      MYSQL_USER: ${DB_USER:?DB_USER is required}
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$${MYSQL_ROOT_PASSWORD}\" mysqladmin ping --host=127.0.0.1 --user=root --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  migrate:
    image: storymera-api:${STORYMERA_IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: Dockerfile.api
    profiles: ["tools"]
    restart: "no"
    environment: *api-environment
    command: ["node", "server-dist/server/migrate.js"]
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  api:
    image: storymera-api:${STORYMERA_IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: Dockerfile.api
    restart: unless-stopped
    environment: *api-environment
    volumes:
      - media_data:/app/.local/media
      - media_trash:/app/.local/media-trash
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  web:
    image: storymera-web:${STORYMERA_IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:?PUBLIC_SITE_URL is required}
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - edge
      - internal
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://127.0.0.1/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

networks:
  edge:
  internal:
    internal: true

volumes:
  mysql_data:
  media_data:
  media_trash:
