map $http_x_forwarded_proto $storymera_forwarded_proto {
    default $scheme;
    ~^(http|https)$ $http_x_forwarded_proto;
}

map $http_x_forwarded_for $storymera_client_ip {
    default $remote_addr;
    ~^\s*(?<first_forwarded_addr>[^,\s]+) $first_forwarded_addr;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 210m;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /api/ {
        proxy_pass http://api:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $storymera_client_ip;
        proxy_set_header X-Forwarded-For $storymera_client_ip;
        proxy_set_header X-Forwarded-Proto $storymera_forwarded_proto;
        proxy_connect_timeout 10s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_request_buffering on;
        proxy_buffering off;
        add_header Cache-Control "no-store" always;
    }

    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-store" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
